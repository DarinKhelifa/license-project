<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wokwi Bridge Test</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 16px; }
      iframe { width: 100%; height: 70vh; border: 1px solid #ccc; }
      pre { white-space: pre-wrap; background: #111; color: #0f0; padding: 12px; min-height: 20vh; }
    </style>
  </head>
  <body>
    <h1>Wokwi Bridge Test</h1>
    <p>Listening for postMessage events from the Wokwi project.</p>
    <iframe id="wokwi" src="https://wokwi.com/projects/464389351261648897"></iframe>
    <pre id="log"></pre>
    <script>
      const log = document.getElementById('log');
      function write(line) {
        log.textContent += line + '\n';
      }
      window.addEventListener('message', (event) => {
        write('origin=' + event.origin + ' data=' + JSON.stringify(event.data));
      });
      write('listener ready');
    </script>
  </body>
</html>
