org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Gradle/Kotlin DSL currently breaks on Java 25.x in this project. Use Android Studio's bundled JBR.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Gradle dependency downloads can fail on flaky networks (e.g., "Connection reset").
# These settings increase timeouts and retries to improve reliability.
org.gradle.internal.http.connectionTimeout=600000
org.gradle.internal.http.socketTimeout=600000
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=2000

# If you are behind a proxy, uncomment and fill these in:
# systemProp.http.proxyHost=
# systemProp.http.proxyPort=
# systemProp.https.proxyHost=
# systemProp.https.proxyPort=

# Some Windows networks/proxies are flaky over IPv6
systemProp.java.net.preferIPv4Stack=true
